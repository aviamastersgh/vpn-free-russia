name: Markdown and repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check UTF-8 Markdown
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            if ! iconv -f UTF-8 -t UTF-8 "$file" >/dev/null 2>&1; then
              echo "ERROR: invalid UTF-8: $file"
              exit 1
            fi

            echo "OK: $file"
          done < <(
            find . \
              -path './.git' -prune -o \
              -path './all_configs.txt' -prune -o \
              -path './verified_configs.txt' -prune -o \
              -path './ru_configs.txt' -prune -o \
              -name '*.md' -type f -print0
          )

      - name: Check required subscription files
        shell: bash
        run: |
          set -euo pipefail

          test -s all_configs.txt
          test -s verified_configs.txt
          test -s ru_configs.txt

      - name: Check language README files
        shell: bash
        run: |
          set -euo pipefail

          test -s README.md
          test -s README.en.md
          test -s README.zh.md
          test -s README.ar.md
