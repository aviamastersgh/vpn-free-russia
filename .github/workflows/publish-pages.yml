name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate site
        run: |
          set -euo pipefail

          test -f site/index.html
          test -f site/robots.txt
          test -f site/sitemap.xml

          grep -q '<title>' site/index.html
          grep -q 'VERIFIED_URL' site/index.html
          grep -q 'ALL_URL' site/index.html

          echo "SITE VALIDATION: OK"

      - name: Publish gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TMP="$(mktemp -d)"

          cp -a site/. "$TMP/"

          cd "$TMP"

          touch .nojekyll

          git init
          git checkout -b gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "deploy: update GitHub Pages"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin gh-pages --force

          echo "GH-PAGES: PUBLISHED"
