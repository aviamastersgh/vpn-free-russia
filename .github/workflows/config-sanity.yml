name: Configuration sanity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration files
        shell: bash
        run: |
          set -euo pipefail

          for file in all_configs.txt verified_configs.txt ru_configs.txt; do
            test -s "$file"

            if LC_ALL=C grep -q $'\x00' "$file"; then
              echo "ERROR: $file contains NUL byte"
              exit 1
            fi

            if ! LC_ALL=C grep -q '[^[:space:]]' "$file"; then
              echo "ERROR: $file contains no configurations"
              exit 1
            fi

            if ! iconv -f UTF-8 -t UTF-8 "$file" >/dev/null 2>&1; then
              echo "ERROR: $file is not valid UTF-8"
              exit 1
            fi

            count=$(grep -cv '^[[:space:]]*$' "$file")
            echo "$file: $count non-empty lines"
          done
